# Test Profile Configuration (In-Memory H2 simulating PostgreSQL)
spring.datasource.url=jdbc:h2:mem:smart_parking_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Sensor threshold for tests
parking.sensor.distance-threshold-cm=15.0

